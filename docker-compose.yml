services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: catprep
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/catprep
      GEMINI_API_KEYS: ${GEMINI_API_KEYS:-dummy_key_for_local_verification}
      SECRET_KEY: ${SECRET_KEY:-change_me_docker_secret}
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: 1440
      FRONTEND_ORIGIN: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
